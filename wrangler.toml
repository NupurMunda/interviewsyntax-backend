name = "interviewsyntax-backend"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
CF_ACCOUNT_ID = "23ead300fd2e0d517e1bf18ee449d0c1"

[[d1_databases]]
binding = "DB"
database_name = "roundwise-db"
database_id = "b0415518-0175-4271-9acb-076f7afd43de"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[analytics_engine_datasets]]
binding = "TRAFFIC"
dataset = "interviewsyntax_traffic"
